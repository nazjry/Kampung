<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Post</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        .container {
            width: 80%;
            margin: auto;
            overflow: hidden;
        }
        header {
            background: #333;
            color: #fff;
            padding-top: 30px;
            min-height: 70px;
            border-bottom: #77d42a 3px solid;
        }
        header a {
            color: #fff;
            text-decoration: none;
            text-transform: uppercase;
            font-size: 16px;
        }
        header ul {
            padding: 0;
            list-style: none;
            margin: 0;
            display: flex;
            justify-content: flex-end;
        }
        header li {
            display: inline;
            padding: 0 20px 0 20px;
        }
        .main {
            padding: 20px;
            background: #fff;
            margin-top: 30px;
        }
        .main h1 {
            text-align: center;
            margin-bottom: 20px;
        }
        .post {
            margin-bottom: 20px;
            padding: 20px;
            border: 1px solid #ddd;
            background: #fff;
        }
        .post h2 {
            margin-top: 0;
        }
        .form-container {
            margin-top: 30px;
        }
        .form-container form {
            display: flex;
            flex-direction: column;
        }
        .form-container input, .form-container textarea {
            margin-bottom: 10px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .form-container input[type="submit"] {
            background: #333;
            color: #fff;
            border: 0;
            cursor: pointer;
        }
        .form-container input[type="submit"]:hover {
            background: #77d42a;
        }
        .form-container input[type="file"] {
            padding: 5px;
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1><a href="#">Blog</a></h1>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </div>
    </header>
    <div class="container main">
        <h1>Blog Posts</h1>
        <div id="posts">
            <!-- Dynamic blog posts will be inserted here -->
        </div>
        <div class="form-container">
            <h2>Add a New Post</h2>
            <form id="postForm">
                <input type="text" id="title" placeholder="Title" required>
                <textarea id="content" placeholder="Content" required></textarea>
                <input type="text" id="imageUrl" placeholder="Image URL (optional)">
                <input type="text" id="videoUrl" placeholder="Video URL (optional)">
                <input type="text" id="linkUrl" placeholder="Link URL (optional)">
                <input type="text" id="linkText" placeholder="Link Text (optional)">
                <input type="file" id="imageUpload" accept="image/*">
                <input type="file" id="videoUpload" accept="video/*">
                <input type="submit" value="Add Post">
            </form>
        </div>
    </div>
    <script>
        document.getElementById('postForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const title = document.getElementById('title').value;
            const content = document.getElementById('content').value;
            const imageUrl = document.getElementById('imageUrl').value;
            const videoUrl = document.getElementById('videoUrl').value;
            const linkUrl = document.getElementById('linkUrl').value;
            const linkText = document.getElementById('linkText').value;
            const imageUpload = document.getElementById('imageUpload').files[0];
            const videoUpload = document.getElementById('videoUpload').files[0];

            if (title && content) {
                const post = document.createElement('div');
                post.classList.add('post');
                post.innerHTML = '<h2>' + title + '</h2><p>' + content + '</p>';

                if (imageUrl) {
                    const img = document.createElement('img');
                    img.src = imageUrl;
                    img.alt = 'Image';
                    img.style.maxWidth = '100%';
                    post.appendChild(img);
                }

                if (videoUrl) {
                    const video = document.createElement('video');
                    video.src = videoUrl;
                    video.controls = true;
                    video.style.maxWidth = '100%';
                    post.appendChild(video);
                }

                if (linkUrl && linkText) {
                    const link = document.createElement('a');
                    link.href = linkUrl;
                    link.textContent = linkText;
                    link.target = '_blank';
                    post.appendChild(link);
                }

                if (imageUpload) {
                    const reader = new FileReader();
                    reader.onload = function (e) {
                        const img = document.createElement('img');
                        img.src = e.target.result;
                        img.alt = 'Image';
                        img.style.maxWidth = '100%';
                        post.appendChild(img);
                    }
                    reader.readAsDataURL(imageUpload);
                }

                if (videoUpload) {
                    const reader = new FileReader();
                    reader.onload = function (e) {
                        const video = document.createElement('video');
                        video.src = e.target.result;
                        video.controls = true;
                        video.style.maxWidth = '100%';
                        post.appendChild(video);
                    }
                    reader.readAsDataURL(videoUpload);
                }

                document.getElementById('posts').appendChild(post);
                document.getElementById('postForm').reset();
            } else {
                alert('Please fill out the title and content fields.');
            }
        });
    </script>
</body>
</html>
